<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>專賣街 Combo Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;500;700&display=swap">
<style>
/* Layout: a little town. Sticky search on top; the chosen shop as a big tile; each combo drawn as a 3-lot block on a road; the full shop list as a tile grid; a cart bar fixed at the bottom that opens a space planner. */
:root{
  --bg:#e7efdc; --lot:#f7f9f2; --ink:#21301b; --muted:#5d6c55; --line:#c3d1b4;
  --grass:#3d8a37; --grass-ink:#ffffff; --road:#7b7f86; --road-line:#f4f1e4;
  --coin:#d89a12; --sel:#fff1c4;
  --display:"DotGothic16","M PLUS 1p",ui-monospace,monospace;
  --body:"M PLUS 1p",system-ui,-apple-system,"PingFang HK","Noto Sans TC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a12; --lot:#1e271b; --ink:#e5eddb; --muted:#97a68c; --line:#33412e;
  --grass:#6cba5e; --grass-ink:#0f170d; --road:#3e434a; --road-line:#c9c4ae;
  --coin:#f0c04a; --sel:#3b3417; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a12; --lot:#1e271b; --ink:#e5eddb; --muted:#97a68c; --line:#33412e;
  --grass:#6cba5e; --grass-ink:#0f170d; --road:#3e434a; --road-line:#c9c4ae;
  --coin:#f0c04a; --sel:#3b3417; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;
  background-image:radial-gradient(color-mix(in srgb,var(--grass) 14%,transparent) 1px,transparent 1.5px);background-size:12px 12px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:18px 6px}
h1{font-family:var(--display);font-weight:400;font-size:1.65rem;margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:.85rem;max-width:60ch}

.ico{width:40px;height:40px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.ico.sm{width:30px;height:30px}
.ico.xs{width:20px;height:20px;display:inline-block;vertical-align:middle}
.ico.lg{width:80px;height:80px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:3px solid var(--line)}
#q{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:3px;background:var(--lot);color:var(--ink)}
#q:focus{outline:none;border-color:var(--grass)}

.hero{display:flex;gap:14px;align-items:center;margin-top:16px;background:var(--lot);border:3px solid var(--ink);border-radius:3px;padding:12px;box-shadow:4px 4px 0 var(--line)}
.hero .txt{min-width:0;flex:1}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero .ttl{font-family:var(--display);font-size:1.45rem;line-height:1.2}
.hero .meta{font-size:.82rem;color:var(--muted)}
.hero .pair{display:flex;gap:6px;align-items:center}
.hero .amp{font-family:var(--display);color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{font:inherit;font-size:.8rem;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:4px 9px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--grass);color:var(--grass-ink);border-color:var(--grass)}
.sizes{display:grid;gap:4px;margin-top:6px}
.szrow{display:flex;gap:8px;align-items:center;font-size:.8rem;flex-wrap:wrap}
.szrow span:first-child{color:var(--muted)}
.szrow select{font:inherit;font-size:.82rem;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}

h2{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:22px 0 10px;display:flex;gap:8px;align-items:baseline}
h2 small{font-family:var(--body);font-size:.8rem;color:var(--muted)}

.combos{display:grid;gap:14px}
.block{background:var(--lot);border:2px solid var(--line);border-radius:3px;overflow:hidden}
.block.incart{border-color:var(--coin)}
.block .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:8px 12px 6px}
.block .name{font-family:var(--display);font-size:1.08rem}
.bonus{display:flex;gap:12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bonus b{font-weight:700}
.bonus .lp b{color:var(--grass)}
.bonus .pr b{color:var(--coin)}
.lots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:0 10px}
.lotbtn{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;color:var(--ink);cursor:pointer;min-width:0}
.lotbtn span{font-size:.78rem;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.lotbtn.me{background:var(--sel);border-color:var(--coin);cursor:default;font-weight:700}
.lotbtn:not(.me):hover{border-color:var(--grass)}
.road{height:12px;background:var(--road);background-image:linear-gradient(90deg,var(--road-line) 0 14px,transparent 14px 28px);background-size:28px 2px;background-repeat:repeat-x;background-position:0 5px}
.space{display:flex;gap:12px;align-items:center;padding:8px 12px 10px;flex-wrap:wrap}
.fpsvg{flex:none;max-width:100%;height:auto}
.fpgrid line{stroke:var(--line);stroke-width:1}
.fp{stroke:var(--ink);stroke-width:1}
.fp0{fill:color-mix(in srgb,var(--grass) 55%,var(--lot))}
.fp1{fill:color-mix(in srgb,var(--coin) 60%,var(--lot))}
.fp2{fill:color-mix(in srgb,var(--road) 45%,var(--lot))}
.fpe{stroke-dasharray:2 2}
.fproad{fill:var(--road)}
.sptxt{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0;flex:1}
.sptxt b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:.98rem}
.sptxt .dims{font-size:.72rem}
.cartbtn{font:inherit;font-size:.82rem;font-weight:700;border:2px solid var(--coin);background:var(--lot);color:var(--ink);border-radius:3px;padding:6px 10px;cursor:pointer;margin-left:auto}
.cartbtn[aria-pressed="true"]{background:var(--coin);color:#21301b}
.tag{display:inline-block;font-size:.66rem;letter-spacing:.04em;padding:1px 5px;border-radius:2px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.tag.est{border-style:dashed;color:var(--coin);border-color:var(--coin)}
.tag.wiki{color:var(--grass);border-color:var(--grass)}
.tag.mine{background:var(--sel);color:var(--ink);border-color:var(--coin)}

.empty{color:var(--muted);background:var(--lot);border:2px dashed var(--line);border-radius:3px;padding:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.tile{font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 4px 6px;background:var(--lot);border:2px solid var(--line);border-radius:3px;color:var(--ink);cursor:pointer;position:relative;min-width:0}
.tile .nm{font-size:.74rem;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.tile .n{position:absolute;top:3px;right:4px;font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .z{position:absolute;top:3px;left:4px;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .z.e::before{content:"≈"}
.tile:hover{border-color:var(--grass)}
.tile.on{background:var(--grass);border-color:var(--grass);color:var(--grass-ink)}
.tile.on .n,.tile.on .z{color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.note{color:var(--muted);font-size:.78rem;margin-top:24px;max-width:65ch}

/* cart */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg)}
.cartbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.cartbar .ct{font-family:var(--display);font-size:1rem;flex:1;min-width:0}
.cartbar .ct small{font-family:var(--body);opacity:.8;font-size:.78rem;display:block}
.cartbar button{font:inherit;font-weight:700;font-size:.9rem;background:var(--coin);color:#21301b;border:0;border-radius:3px;padding:8px 14px;cursor:pointer}
.cartbar button:disabled{opacity:.5;cursor:default}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--lot);border-top:3px solid var(--ink);max-height:82%;overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 0 color-mix(in srgb,var(--ink) 15%,transparent)}
.scrim{position:fixed;inset:0;z-index:25;background:color-mix(in srgb,#000 35%,transparent)}
.sheet .in{max-width:760px;margin:0 auto}
.sheet h3{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clist{display:grid;gap:6px;margin:10px 0}
.citem{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;flex-wrap:wrap}
.citem .cn{font-family:var(--display);min-width:0}
.citem .icons{display:flex;gap:2px}
.citem .rm{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.stat .v{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.74rem;color:var(--muted)}
.plan{background:var(--bg);border:2px solid var(--line);border-radius:3px;padding:10px;overflow-x:auto}
.plan svg{display:block;max-width:none}
.plan .pl{fill:color-mix(in srgb,var(--grass) 30%,var(--lot));stroke:var(--ink);stroke-width:1.5}
.plan .pl.sh{fill:var(--sel);stroke:var(--coin);stroke-width:2.5}
.plan .pl.e{stroke-dasharray:4 3}
.plan .pg{stroke:var(--line);stroke-width:1}
.plan .rd{fill:var(--road)}
.plan .rdl{stroke:var(--road-line);stroke-width:1.5;stroke-dasharray:6 6;fill:none}
.plan text{font-family:var(--body);font-size:9px;fill:var(--ink)}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.legend{font-size:.76rem;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px;border:1.5px solid var(--ink);background:color-mix(in srgb,var(--grass) 30%,var(--lot))}
.legend i.sh{background:var(--sel);border-color:var(--coin)}
.why{font-size:.82rem;color:var(--muted);margin:6px 0 0;max-width:65ch}

.en{display:block;font-family:var(--body);font-size:.7rem;font-weight:400;color:var(--muted);letter-spacing:.02em;line-height:1.2}
.hero .en{font-size:.78rem;margin-top:2px}
.citem .cn .en{font-size:.68rem}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

:root[lang="zh-Hant"]{--display:"M PLUS 1p",system-ui,"PingFang HK","Noto Sans TC",sans-serif}
:root[lang="zh-Hans"]{--display:system-ui,"PingFang SC","Noto Sans SC",sans-serif;--body:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
:root[lang="ko"]{--display:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--body:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.langsw{display:inline-flex;flex-wrap:wrap;max-width:100%;border:2px solid var(--ink);border-radius:3px;overflow:hidden;flex:none}
.langsw button{font:inherit;font-size:.82rem;border:0;background:var(--lot);color:var(--ink);padding:5px 10px;cursor:pointer}
.langsw button+button{border-left:2px solid var(--ink)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.fpdoor{fill:var(--ink)}
.plan .dr{fill:var(--ink)}
.plan .pl.deco{fill:color-mix(in srgb,var(--coin) 18%,var(--lot));stroke-dasharray:1 3}
.legend i.dr{background:var(--ink);height:4px;vertical-align:2px}
.legend i.deco{background:color-mix(in srgb,var(--coin) 18%,var(--lot));border-style:dotted}
.rdbtn{font-size:.72rem;padding:2px 7px}
.credits a{color:inherit;text-decoration:underline}
</style>
</head>

<header>

const enSub=s=>lang==="en"?"":`<span class="en">${esc(s)}</span>`;
const BYNAME=Object.fromEntries(COMBOS.map(c=>[c.n,c]));
const MAXCART=4;

function save(){try{localStorage.setItem("dts-sel",JSON.stringify(selected));localStorage.setItem("dts-cart",JSON.stringify(cart));localStorage.setItem("dts-share",share?"1":"0");localStorage.setItem("dts-lang",lang);}catch(e){}}
function setSel(s){selected=s;save();render();}
function pick(shop){
  if(selected.includes(shop)) setSel(selected.filter(x=>x!==shop));
  else setSel(selected.length>=2?[selected[1],shop]:[...selected,shop]);
  window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function toggleCart(n){
  if(cart.includes(n)) cart=cart.filter(x=>x!==n);
  else if(cart.length<MAXCART) cart=[...cart,n];
  save(); render();
}
function setLang(l){lang=l;save();applyStatic();render();}

/* ---------- Space planner ---------- */
const touch=(r,s)=>{
  const oy=Math.min(r.y+r.h,s.y+s.h)-Math.max(r.y,s.y), ox=Math.min(r.x+r.w,s.x+s.w)-Math.max(r.x,s.x);
  return ((r.x+r.w===s.x||s.x+s.w===r.x)&&oy>0)||((r.y+r.h===s.y||s.y+s.h===r.y)&&ox>0);
};
function groupConnected(ids,P){
  const seen=new Set([ids[0]]),st=[ids[0]];
  while(st.length){const a=st.pop();for(const b of ids) if(!seen.has(b)&&touch(P[a],P[b])){seen.add(b);st.push(b);}}
  return seen.size===ids.length;
}
function permutations(n){const out=[],a=[...Array(n).keys()];(function go(k){if(k===n){out.push(a.slice());return}for(let i=k;i<n;i++){[a[k],a[i]]=[a[i],a[k]];go(k+1);[a[k],a[i]]=[a[i],a[k]];}})(0);return out;}

function plan(combos){
  // Buildings: shared once when sharing is on
  let items=[], groups=[];
  if(share){
    const names=[...new Set(combos.flatMap(c=>c.parts))];
    items=names.map(n=>({n}));
    groups=combos.map(c=>c.parts.map(p=>names.indexOf(p)));
  }else{
    combos.forEach(c=>{groups.push(c.parts.map(p=>{items.push({n:p});return items.length-1}));});
  }
  items.forEach(it=>{const z=size(it.n);it.a=Math.max(z.w,z.h);it.b=Math.min(z.w,z.h);it.est=z.src==="est";it.road=needsRoad(it.n);
    it.shared=groups.filter(g=>g.includes(items.indexOf(it))).length>1;});
  const tiles=items.reduce((t,i)=>t+i.a*i.b,0);
  const sep=combos.reduce((t,c)=>t+c.parts.reduce((u,p)=>{const z=size(p);return u+z.w*z.h},0),0);
  const N=items.length;

  // Option A: one row along a road (every building fronts the road)
  let row=null;
  if(N<=8){
    const H=Math.max(...items.map(i=>i.a)), W=items.reduce((t,i)=>t+i.b,0);
    for(const order of permutations(N)){
      const pos=new Array(N); let x=0;
      order.forEach(i=>{pos[i]={x,y:H-items[i].a,w:items[i].b,h:items[i].a,door:items[i].road?"b":null};x+=items[i].b;});
      if(groups.every(g=>groupConnected(g,pos))){row={W,H,pos,kind:"row"};break;}
    }
  }

  // Option B: smallest rectangle block. Every building must touch the block's edge so a road around it reaches them all.
  let block=null, timedOut=false;
  const limitArea=row?row.W*row.H:Infinity;
  const maxSide=items.reduce((t,i)=>t+i.a,0);
  const boxes=[];
  for(let H=1;H<=maxSide;H++)for(let W=H;W<=maxSide;W++){
    const A=W*H; if(A<tiles||A>=limitArea) continue;
    if(items.every(i=>i.b<=H&&i.a<=W)) boxes.push({W,H,A});
  }
  boxes.sort((p,q)=>p.A-q.A||(p.W-p.H)-(q.W-q.H));
  const order=[...items.keys()].sort((p,q)=>items[q].a*items[q].b-items[p].a*items[p].b);
  let steps=0; const BUDGET=400000, T0=Date.now();
  const groupOf=items.map((_,i)=>groups.filter(g=>g.includes(i)));
  for(const bx of boxes){
    const P=new Array(N); const placed=new Set();
    const ok=(function dfs(k){
      if(++steps>BUDGET||(steps%2000===0&&Date.now()-T0>1200)){timedOut=true;return false;}
      if(k===N) return true;
      const i=order[k], it=items[i];
      const ors=it.a===it.b?[[it.a,it.b]]:[[it.a,it.b],[it.b,it.a]];
      for(const [w,h] of ors){
        if(w>bx.W||h>bx.H) continue;
        const xm=k===0?Math.floor((bx.W-w)/2):bx.W-w, ym=k===0?Math.floor((bx.H-h)/2):bx.H-h;
        for(let y=0;y<=ym;y++)for(let x=0;x<=xm;x++){
          let door=null;
          if(it.road){
            const top=y===0,bot=y+h===bx.H,lef=x===0,rig=x+w===bx.W;
            if(w===h) door=bot?"b":top?"t":lef?"l":rig?"r":null;
            else if(w<h) door=bot?"b":top?"t":null;   // long side vertical: doors on top/bottom ends
            else door=lef?"l":rig?"r":null;           // long side horizontal: doors on left/right ends
            if(!door) continue;
          }
          const r={x,y,w,h,door}; let clash=false;
          for(const j of placed){const s=P[j];if(r.x<s.x+s.w&&s.x<r.x+r.w&&r.y<s.y+s.h&&s.y<r.y+r.h){clash=true;break;}}
          if(clash) continue;
          P[i]=r; placed.add(i);
          let good=true;
          for(const g of groupOf[i]) if(g.every(j=>placed.has(j))&&!groupConnected(g,P)){good=false;break;}
          if(good&&dfs(k+1)) return true;
          placed.delete(i); P[i]=undefined;
          if(timedOut) return false;
        }
      }
      return false;
    })(0);
    if(ok){block={W:bx.W,H:bx.H,pos:P,kind:"block"};break;}
    if(timedOut) break;
  }
  // Fallback when nothing else is found and the combos share no buildings: each combo in its own row, rows separated by a 1-tile road.
  let stack=null;
  const disjoint=groups.every((g,i)=>groups.every((h,j)=>i===j||!g.some(x=>h.includes(x))));
  if(!row&&!block&&disjoint){
    const pos=new Array(N), roadRows=[]; let y=0, W=0;
    groups.forEach(g=>{const H=Math.max(...g.map(i=>items[i].a)); let x=0;
      g.forEach(i=>{pos[i]={x,y:y+H-items[i].a,w:items[i].b,h:items[i].a,door:items[i].road?"b":null};x+=items[i].b;});
      W=Math.max(W,x); y+=H; roadRows.push(y); y+=1;});
    stack={W,H:y-1,pos,kind:"stack",roadRows:roadRows.slice(0,-1)};
  }
  return {items,groups,tiles,sep,row,block,stack,timedOut};
}

function drawPlan(p,L){
  const T=26, pad=10, W=L.W*T, H=L.H*T;
  const ring=L.kind==="block";
  const ox=ring?pad+10:pad, oy=ring?pad+10:pad;
  const tw=W+ox*2, th=H+oy+(ring?pad+10:22);
  let g="";
  for(let i=0;i<=L.W;i++) g+=`<line class="pg" x1="${ox+i*T}" y1="${oy}" x2="${ox+i*T}" y2="${oy+H}"/>`;
  for(let j=0;j<=L.H;j++) g+=`<line class="pg" x1="${ox}" y1="${oy+j*T}" x2="${ox+W}" y2="${oy+j*T}"/>`;
  let road="";
  if(ring){road=`<rect class="rd" x="${ox-10}" y="${oy-10}" width="${W+20}" height="${H+20}"/><rect fill="var(--bg)" x="${ox}" y="${oy}" width="${W}" height="${H}"/><rect class="rdl" x="${ox-5}" y="${oy-5}" width="${W+10}" height="${H+10}"/>`;}
  else{road=`<rect class="rd" x="${ox-pad}" y="${oy+H+2}" width="${W+pad*2}" height="14"/><line class="rdl" x1="${ox-pad}" y1="${oy+H+9}" x2="${ox+W+pad}" y2="${oy+H+9}"/>`;
    (L.roadRows||[]).forEach(r=>{road+=`<rect class="rd" x="${ox-pad}" y="${oy+r*T}" width="${W+pad*2}" height="${T}"/><line class="rdl" x1="${ox-pad}" y1="${oy+r*T+T/2}" x2="${ox+W+pad}" y2="${oy+r*T+T/2}"/>`;});}
  const lots=p.items.map((it,i)=>{const r=L.pos[i];const x=ox+r.x*T,y=oy+r.y*T,w=r.w*T,h=r.h*T;const s=Math.min(w,h)>=40?28:18;
    const d=r.door, dl=Math.min(w,h)*0.4, door=d==="b"?`<rect class="dr" x="${x+w/2-dl/2}" y="${y+h-5}" width="${dl}" height="4"/>`:d==="t"?`<rect class="dr" x="${x+w/2-dl/2}" y="${y+1}" width="${dl}" height="4"/>`:d==="l"?`<rect class="dr" x="${x+1}" y="${y+h/2-dl/2}" width="4" height="${dl}"/>`:d==="r"?`<rect class="dr" x="${x+w-5}" y="${y+h/2-dl/2}" width="4" height="${dl}"/>`:"";
    return `<rect class="pl${it.shared?" sh":""}${it.est?" e":""}${it.road?"":" deco"}" x="${x+1}" y="${y+1}" width="${w-2}" height="${h-2}"/>${door}
      <image href="${iconURL(it.n)}" x="${x+w/2-s/2}" y="${y+h/2-s/2-(h>=52?6:0)}" width="${s}" height="${s}" style="image-rendering:pixelated"/>
      ${h>=52&&w>=52?`<text x="${x+w/2}" y="${y+h/2+s/2+4}" text-anchor="middle">${(()=>{const s=bn(it.n);return esc(s.length>12?s.slice(0,11)+"…":s)})()}</text>`:""}`}).join("");
  return `<svg width="${tw}" height="${th}" viewBox="0 0 ${tw} ${th}" role="img" aria-label="${esc(UI[lang].layoutAria)}">${road}${g}${lots}</svg>`;
}



function renderSheet(){
  const el=$("sheetin"), t=L();
  const combos=cart.map(n=>BYNAME[n]).filter(Boolean);
  let html=`<div class="shead"><h3>${t.planner}</h3><button class="btn" id="closecart">${t.close}</button></div>`;
  if(!combos.length){el.innerHTML=html+`<div class="empty" style="margin-top:10px">${t.emptyCart(MAXCART)}</div>`;return;}
  html+=`<div class="clist">${combos.map(c=>`<div class="citem"><span class="icons">${c.parts.map(p=>`<img class="ico xs" src="${iconURL(p)}" alt="${esc(bn(p))}">`).join("")}</span>
    <span class="cn">${esc(cn(c.n))}${enSub(c.n)}</span><span class="bonus"><span class="lp">${t.land} <b>+${c.lp}%</b></span><span class="pr">${t.price} <b>+${c.pr}%</b></span></span>
    <button class="btn rm" data-cart="${esc(c.n)}">${t.remove}</button></div>`).join("")}</div>`;
  if(combos.length<2){el.innerHTML=html+`<div class="empty">${t.addMore}</div>`;return;}
  const key=JSON.stringify([cart,share,MINE,ROAD_OVR]);
  if(!renderSheet.memo||renderSheet.memo.key!==key) renderSheet.memo={key,p:plan(combos)};
  const p=renderSheet.memo.p;
  const best=p.block||p.row||p.stack;
  const sharedNames=p.items.filter(i=>i.shared).map(i=>i.n);
  html+=`<div class="opts"><button class="btn" data-share="1" aria-pressed="${share}">${t.share}</button><button class="btn" data-share="0" aria-pressed="${!share}">${t.sep}</button></div>`;
  html+=`<div class="stats">
    <div class="stat"><div class="v">${p.items.length}</div><div class="l">${t.bld}${share&&sharedNames.length?t.shared(sharedNames.length):""}</div></div>
    <div class="stat"><div class="v">${p.tiles}</div><div class="l">${t.covered}${share&&p.sep>p.tiles?t.saves(p.sep-p.tiles):""}</div></div>
    <div class="stat"><div class="v">${best?best.W+"×"+best.H:"—"}</div><div class="l">${best?t.smallest(best.W*best.H):t.noLayout}</div></div>
  </div>`;
  if(best){
    html+=`<div class="eyebrow">${best.kind==="block"?t.kBlock:best.kind==="row"?t.kRow:t.kStack}</div>
      <div class="plan">${drawPlan(p,best)}</div>
      <div class="legend"><span><i></i>${t.legBld}</span>${sharedNames.length?`<span><i class="sh"></i>${t.legShared}</span>`:""}<span><i class="dr"></i>${t.legDoor}</span><span><i class="deco"></i>${t.legDeco}</span><span>${t.legDash}</span></div>`;
    const alt=best.kind==="block"?p.row:null;
    html+=`<p class="why">${best.kind==="block"?t.whyBlock+(alt?t.whyAlt(alt.W,alt.H):""):best.kind==="row"?t.whyRow:t.whyStack}${sharedNames.length?t.sharedNote(sharedNames.map(n=>esc(bn(n))).join(t.listSep),sharedNames.length>1):""}${p.timedOut?t.timedOut:""}</p>`;
    if(alt){html+=`<details style="margin-top:8px"><summary class="eyebrow" style="cursor:pointer">${t.showRow}</summary><div class="plan" style="margin-top:6px">${drawPlan(p,alt)}</div></details>`;}
  }else{
    html+=`<div class="empty">${t.noLayoutMsg(p.tiles)}</div>`;
  }
  el.innerHTML=html;
}
function setSheet(open){
  sheetOpen=open; $("sheet").hidden=!open; $("scrim").hidden=!open;
  document.body.style.overflow=open?"hidden":"";
  if(open) renderSheet();
}

function applyStatic(){
  const t=L();
  document.documentElement.lang=LOC[lang];
  document.title=t.title;
  $("h1").textContent=t.title; $("sub").textContent=t.sub;
  $("q").placeholder=t.search; $("q").setAttribute("aria-label",t.searchAria);
  $("allshops").firstChild.textContent=t.allShops+" ";
  $("note").textContent=t.note;
  $("credits").innerHTML=t.credits;
  $("opencart").textContent=t.plan;
  $("langsw").setAttribute("aria-label",t.lang);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("sheet").setAttribute("aria-label",t.planner);
}

function render(){
  const t=L();
  let list=COMBOS.filter(c=>selected.length&&selected.every(s=>c.parts.includes(s)));
  list.forEach(c=>c.sp=space(c));
  list.sort((a,b)=>sortMode==="lp"?(b.lp-a.lp||b.pr-a.pr):sortMode==="pr"?(b.pr-a.pr||b.lp-a.lp):(a.sp.tiles-b.sp.tiles||a.sp.W-b.sp.W||b.lp-a.lp));

  const hero=$("hero");
  if(!selected.length){
    hero.innerHTML=`<div class="hero"><div class="txt"><div class="eyebrow">${t.noSel}</div><div class="ttl">${t.pickBelow}</div><div class="meta">${t.willAppear}</div></div></div>`;
  }else{
    const icons=selected.length===1?img(selected[0],"lg"):`<div class="pair">${img(selected[0],"lg")}<span class="amp">+</span>${img(selected[1],"lg")}</div>`;
    hero.innerHTML=`<div class="hero">${icons}<div class="txt">
      <div class="eyebrow">${selected.length===1?t.selShop:t.withBoth}</div>
      <div class="ttl">${selected.map(s=>esc(bn(s))).join(" + ")}</div>
      ${lang==="en"?"":`<div class="en">${selected.map(esc).join(" + ")}</div>`}
      <div class="meta">${t.nCombos(list.length)}</div>
      <div class="sizes">${selected.map(s=>{const z=size(s);return `<label class="szrow"><span>${esc(bn(s))}</span>
        <select data-size="${esc(s)}" aria-label="${esc(t.sizeOf(bn(s)))}">${SIZE_OPTS.map(o=>`<option value="${o[0]}x${o[1]}"${o[0]===z.w&&o[1]===z.h?" selected":""}>${o[0]}×${o[1]}</option>`).join("")}</select>
        <span class="tag ${z.src}">${z.src==="wiki"?t.tagWiki:z.src==="mine"?t.tagMine:t.tagEst}</span>
        <button class="btn rdbtn" data-road="${esc(s)}" aria-pressed="${needsRoad(s)}">${needsRoad(s)?t.roadYes:t.roadNo}</button></label>`}).join("")}</div>
      <div class="ctl">
        <button class="btn" data-sort="lp" aria-pressed="${sortMode==="lp"}">${t.sortLand}</button>
        <button class="btn" data-sort="pr" aria-pressed="${sortMode==="pr"}">${t.sortPrice}</button>
        <button class="btn" data-sort="sp" aria-pressed="${sortMode==="sp"}">${t.sortSpace}</button>
        <button class="btn" data-clear="1">${t.clear}</button>
      </div></div></div>`;
  }

  const res=$("results");
  if(!selected.length){res.innerHTML="";}
  else if(!list.length){res.innerHTML=`<h2>${t.combos}</h2><div class="empty">${t.never}</div>`;}
  else{
    const full=cart.length>=MAXCART;
    res.innerHTML=`<h2>${t.combos} <small>${t.tapPartner}</small></h2><div class="combos">${list.map(c=>{const inc=cart.includes(c.n);return `
      <div class="block${inc?" incart":""}">
        <div class="head"><span class="name">${esc(cn(c.n))}${enSub(c.n)}</span>
          <span class="bonus"><span class="lp">${t.land} <b>+${c.lp}%</b></span><span class="pr">${t.price} <b>+${c.pr}%</b></span></span></div>
        <div class="lots">${c.parts.map(p=>selected.includes(p)
          ?`<div class="lotbtn me">${img(p)}<span>${esc(bn(p))}</span></div>`
          :`<button class="lotbtn" data-s="${esc(p)}">${img(p)}<span>${esc(bn(p))}</span></button>`).join("")}</div>
        <div class="road"></div>
        <div class="space">${footprint(c.sp)}<div class="sptxt"><b>${t.tiles(c.sp.tiles)}</b>${c.sp.est?` <span class="tag est">${t.estimate}</span>`:""}
          <span>${t.rowAlong(c.sp.W,c.sp.H)}</span>
          <span class="dims">${c.sp.L.map(l=>`${l.w}×${l.h}`).join(" + ")}</span></div>
          <button class="cartbtn" data-cart="${esc(c.n)}" aria-pressed="${inc}"${!inc&&full?` disabled title="${esc(t.cartFull)}"`:""}>${inc?t.inCart:t.addCart}</button></div>
      </div>`}).join("")}</div>`;
  }

  const q=$("q").value.trim().toLowerCase();
  const shown=SHOPS.filter(s=>!q||s.toLowerCase().includes(q)||["ja","zh","zhs","ko"].some(k=>NAMES[k].b[s]?.includes(q)))
    .sort((a,b)=>bn(a).localeCompare(bn(b),LOC[lang]));
  $("shopcount").textContent=t.ofN(shown.length,SHOPS.length);
  $("grid").innerHTML=shown.map(s=>{const z=size(s);return `<button class="tile${selected.includes(s)?" on":""}" data-s="${esc(s)}" aria-pressed="${selected.includes(s)}" title="${esc(s)}">
    <span class="n">${count[s]}</span><span class="z${z.src==="est"?" e":""}">${z.w}×${z.h}</span>${img(s,"sm")}<span class="nm">${esc(bn(s))}</span></button>`}).join("")||`<div class="empty">${t.noMatch}</div>`;

  $("cartct").innerHTML=cart.length?`${t.cartN(cart.length)}<small>${cart.map(n=>esc(cn(n))).join(" · ")}</small>`:`${t.cartEmpty}<small>${t.cartHint}</small>`;
  $("opencart").disabled=!cart.length;
  if(sheetOpen) renderSheet();
}

document.addEventListener("click",e=>{
  const rb=e.target.closest("[data-road]"); if(rb){e.preventDefault();const n=rb.dataset.road;const v=!needsRoad(n);if(v===!NO_ROAD.has(n)) delete ROAD_OVR[n]; else ROAD_OVR[n]=v;try{localStorage.setItem("dts-road",JSON.stringify(ROAD_OVR))}catch(err){}render();return;}
  const lb=e.target.closest("[data-lang]"); if(lb){setLang(lb.dataset.lang);return;}
  if(e.target.closest("#opencart")){setSheet(true);return;}
  if(e.target.closest("#closecart")||e.target.id==="scrim"){setSheet(false);return;}
  const sh=e.target.closest("[data-share]"); if(sh){share=sh.dataset.share==="1";save();renderSheet();return;}
  const cb=e.target.closest("[data-cart]"); if(cb){toggleCart(cb.dataset.cart);return;}
  const so=e.target.closest("[data-sort]"); if(so){sortMode=so.dataset.sort;render();return;}
  if(e.target.closest("[data-clear]")){setSel([]);return;}
  const b=e.target.closest("[data-s]"); if(b) pick(b.dataset.s);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOpen) setSheet(false);});
document.addEventListener("change",e=>{
  const s=e.target.closest("[data-size]"); if(!s) return;
  const [w,h]=s.value.split("x").map(Number), name=s.dataset.size;
  const base=VERIFIED[name]||ESTIMATED[name]||[2,2];
  if(w===base[0]&&h===base[1]) delete MINE[name]; else MINE[name]=[w,h];
  try{localStorage.setItem("dts-size",JSON.stringify(MINE))}catch(err){}
  render();
});
$("q").addEventListener("input",render);
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){const q=e.target.value.trim().toLowerCase();if(!q)return;
    const m=SHOPS.find(s=>s.toLowerCase()===q||bn(s).toLowerCase()===q)||SHOPS.find(s=>s.toLowerCase().includes(q)||bn(s).toLowerCase().includes(q));
    if(m){e.target.value="";pick(m);}}
});
try{
  const s=JSON.parse(localStorage.getItem("dts-sel")||"null");if(Array.isArray(s))selected=s.filter(x=>count[x]).slice(0,2);
  const c=JSON.parse(localStorage.getItem("dts-cart")||"null");if(Array.isArray(c))cart=c.filter(x=>BYNAME[x]).slice(0,MAXCART);
  share=localStorage.getItem("dts-share")!=="0";
}catch(e){}
if(!selected.length) selected=["Cakery"];
if(!cart.length) cart=["Sweets","Fresh-Made"];
applyStatic();
render();

</script>
